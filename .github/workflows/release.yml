name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git gcc pkg-config \
            gtk4-devel libadwaita-devel openxr-devel \
            cargo rust

      - uses: actions/checkout@v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --lib --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Build deb package
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      - name: Build rpm package
        run: |
          cargo install cargo-generate-rpm
          cargo generate-rpm

      - name: Compute checksum from GitHub tarball
        id: checksum
        run: |
          VERSION=${{ steps.version.outputs.version }}
          curl -sL "https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz" \
            -o motocalgui-${VERSION}.tar.gz
          SHA=$(sha256sum motocalgui-${VERSION}.tar.gz | cut -d' ' -f1)
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"
          echo "${SHA}  motocalgui-${VERSION}.tar.gz" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            motocalgui-${{ steps.version.outputs.version }}.tar.gz
            SHA256SUMS
            target/debian/*.deb
            target/generate-rpm/*.rpm
