[package]
name = "motocalgui"
version = "1.1.0"
edition = "2024"
description = "GTK4 frontend for libmotoc, the Monado tracking origin calibrator"
repository = "https://github.com/ReinaS-64892/MotocalGUI"
license = "GPL-3.0-only"
keywords = ["vr", "monado", "wivrn", "calibration", "tracking"]
categories = ["gui"]

[lib]
name = "motocalgui"
path = "src/lib.rs"

[[bin]]
name = "motocalgui"
path = "src/main.rs"

[dependencies]
dirs = "6.0.0"
gtk4 = { version = "0.10.3", features = ["v4_12"] }
libadwaita = { version = "0.8.1", features = ["v1_5"] }
async-channel = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
libmonado = "1.6"
libmotoc = "0.4.0"
openxr_mndx_xdev_space = "0.2.0"
openxr = { version = "0.21", default-features = false, features = ["linked", "mint"] }
thiserror = "2"
futures-util = "0.3"

[package.metadata.deb]
section = "utils"
depends = "libgtk-4-1 (>= 4.12), libadwaita-1-0 (>= 1.5), libopenxr-loader1, monado-service"
assets = [
    ["target/release/motocalgui", "usr/bin/", "755"],
    ["data/io.github.ReinaS_64892.MotocalGUI.desktop", "usr/share/applications/", "644"],
    ["data/io.github.ReinaS_64892.MotocalGUI.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/io.github.ReinaS_64892.MotocalGUI.metainfo.xml", "usr/share/metainfo/", "644"],
    ["LICENSE", "usr/share/doc/motocalgui/", "644"],
    ["NOTICE", "usr/share/doc/motocalgui/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/motocalgui", dest = "/usr/bin/motocalgui", mode = "755" },
    { source = "data/io.github.ReinaS_64892.MotocalGUI.desktop", dest = "/usr/share/applications/io.github.ReinaS_64892.MotocalGUI.desktop", mode = "644" },
    { source = "data/io.github.ReinaS_64892.MotocalGUI.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.ReinaS_64892.MotocalGUI.svg", mode = "644" },
    { source = "data/io.github.ReinaS_64892.MotocalGUI.metainfo.xml", dest = "/usr/share/metainfo/io.github.ReinaS_64892.MotocalGUI.metainfo.xml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/motocalgui/LICENSE", mode = "644" },
    { source = "NOTICE", dest = "/usr/share/licenses/motocalgui/NOTICE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.12"
libadwaita = ">= 1.5"
openxr = "*"
monado = "*"

[profile.release]
lto = true
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
